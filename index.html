<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จ่าใหญ่ — แดชบอร์ดข้อมูลส่วนบุคคล</title>
  <meta name="description" content="จ่าใหญ่ — เครื่องมือติดตามว่าใครถือข้อมูลส่วนบุคคลของคุณ และสั่งลบได้ในแตะเดียวตามสิทธิ์ PDPA (ต้นแบบ)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23020C2C'/%3E%3Cpath d='M12 3l7 2.6v5.6c0 4.8-3.1 8-7 9.8-3.9-1.8-7-5-7-9.8V5.6z' fill='%23F7D047'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="hero wrap">
      <div class="panel briefing reveal">
        <div class="briefing-mascot">
          <div class="bob" id="hero-mascot"></div>
        </div>
        <div class="briefing-body">
          <p class="eyebrow">รายงานสถานการณ์ / Status Report</p>
          <h1 id="hero-headline">กำลังตรวจแฟ้มข้อมูลของคุณ…</h1>
          <p class="sub" id="hero-sub"></p>
          <div class="score-row">
            <div id="hero-meter"></div>
            <span class="chip" id="hero-tier-chip" hidden></span>
          </div>
          <div class="bubble" id="hero-verdict" style="margin-top:18px" hidden>
            <span class="who">คำวินิจฉัยของจ่าใหญ่ / Verdict</span>
            <span id="hero-verdict-text"></span>
          </div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="section wrap" id="tracking-section">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow">DSR Tracking / ติดตามคำขอ</p>
          <h2>คำขอลบข้อมูลของคุณกำลังเดินทาง</h2>
        </div>
        <a class="more" href="requests.html">ดูคำขอทั้งหมด →</a>
      </div>
      <div class="tracker-list" id="tracker-list"></div>
    </section>

    <section class="section wrap" id="reco-section">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow">คำแนะนำจากจ่าใหญ่ / Recommended</p>
          <h2>รายการที่จ่าใหญ่อยากให้จัดการก่อน</h2>
        </div>
        <a class="more" href="inventory.html">ดูคลังข้อมูลทั้งหมด →</a>
      </div>
      <div class="reco-list" id="reco-list"></div>
    </section>
  </main>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
